name: CI Checks

on:
  push:
    branches: ['*']

jobs:
  lint_and_typecheck:
    name: Lint & Type Check
    steps:
      - uses: eas/checkout@v1
      - uses: eas/use-npm-token@v1
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: TypeScript check
        run: npx tsc --noEmit
